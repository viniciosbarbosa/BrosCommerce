<div class="error-container">
  <div class="error-content">
    <div class="error-code">{{ code() }}</div>
    <div class="error-title">{{ titleKey() | translate }}</div>
    <div class="error-message">{{ messageKey() | translate }}</div>
    <div class="error-actions">
      <a [routerLink]="routerLink()" class="btn-home">{{ routerLinkText() | translate }}</a>
    </div>
  </div>
</div>
